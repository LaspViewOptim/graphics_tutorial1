[package]
name = "graphics_tutorial1"
version = "0.1.0"
edition = "2021"

[lib]
name = "graphics_tutorial1_lib"
crate-type = ["cdylib", "rlib"]

[profile.release]
strip = true

[dependencies]
winit = { version = "0.29", features = ["rwh_05"] }
env_logger = "0.10"
log = "0.4"
wgpu = "24.0"
cfg-if = "1"
pollster = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
console_log = "1.0"
wgpu = { version = "24.0", features = ["webgl"]}
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4.30"
web-sys = { version = "0.3", features = [
    "Document",
    "Window",
    "Element",
]}